name: Publish GitHub Pages

on:
  push:
    branches: ["codex"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build_site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Pagefind shards in parallel
        run: |
          set -euo pipefail

          batch_size=25
          rm -rf ./public/pagefind
          mkdir -p ./public/pagefind

          matrix_json=$(node ../tools/plan_pagefind_batches.mjs --index ./public/volumes.json --batch-size "$batch_size" --format matrix)
          printf '%s\n' "$matrix_json" > /tmp/pagefind-matrix.json

          total_batches=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('/tmp/pagefind-matrix.json','utf8')); process.stdout.write(String((m.include || []).length));")
          if [ "$total_batches" -eq 0 ]; then
            echo "Nenhum lote Pagefind foi planejado"
            exit 1
          fi

          limit=$(nproc)
          if [ "$limit" -lt 2 ]; then
            limit=2
          fi

          echo "Construindo $total_batches lotes Pagefind com concorrência $limit"

          active=0
          while IFS= read -r batch; do
            batch_index=$(node -e "const item=JSON.parse(process.argv[1]); process.stdout.write(String(item.batch_index));" "$batch")
            batch_id=$(node -e "const item=JSON.parse(process.argv[1]); process.stdout.write(String(item.batch_id));" "$batch")

            echo "Iniciando $batch_id"
            node ../tools/build_pagefind_from_shards.mjs \
              --public ./public \
              --out "./public/pagefind/$batch_id" \
              --base /BibliothecaPatristica \
              --batch-size "$batch_size" \
              --batch-index "$batch_index" \
              --source-manifest ./public/volumes.json &

            active=$((active + 1))
            if [ "$active" -ge "$limit" ]; then
              wait -n
              active=$((active - 1))
            fi
          done < <(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('/tmp/pagefind-matrix.json','utf8')); for (const item of m.include || []) console.log(JSON.stringify(item));")

          while [ "$active" -gt 0 ]; do
            wait -n
            active=$((active - 1))
          done

      - name: Write Pagefind manifest
        run: node ../tools/plan_pagefind_batches.mjs --index ./public/volumes.json --batch-size 25 --format manifest --manifest-out ./public/pagefind/manifest.json

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
