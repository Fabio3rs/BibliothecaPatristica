name: Publish GitHub Pages

on:
  push:
    branches: ["codex"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build_site:
    runs-on: ubuntu-latest
    env:
      INDEXADOR_VERSION: v0.6
      INDEXADOR_NATIVE_SHA256: 9c87b719e6a05dd7e0b729d270db4e869ab723f47aecc8563a199187da92b427
      INDEXADOR_ASSETS_SHA256: 1f292cc362353a2ef3b2c36b11d41bb562b7bda2a0d9459119361f4f0823198c
      PUBLIC_INDEXADOR_INDICES_VERSION: ${{ github.sha }}
      PUBLIC_INDEXADOR_SEARCH_VERSION: ${{ github.sha }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download PatrologiaIndexer release
        run: |
          set -euo pipefail

          release_base="https://github.com/Fabio3rs/PatrologiaIndexer/releases/download/${INDEXADOR_VERSION}"
          release_dir="${RUNNER_TEMP}/patrologia-indexer-${INDEXADOR_VERSION}"
          native_archive="${release_dir}/indexador-linux-x86_64-static-${INDEXADOR_VERSION}.tar.gz"
          assets_archive="${release_dir}/indexador-assets-${INDEXADOR_VERSION}.tar.gz"

          mkdir -p "${release_dir}" ./public/indexador/runtime
          curl --fail --location --retry 3 --output "${native_archive}" \
            "${release_base}/indexador-linux-x86_64-static-${INDEXADOR_VERSION}.tar.gz"
          curl --fail --location --retry 3 --output "${assets_archive}" \
            "${release_base}/indexador-assets-${INDEXADOR_VERSION}.tar.gz"

          printf '%s  %s\n' "${INDEXADOR_NATIVE_SHA256}" "${native_archive}" | sha256sum --check --status
          printf '%s  %s\n' "${INDEXADOR_ASSETS_SHA256}" "${assets_archive}" | sha256sum --check --status

          tar -xzf "${native_archive}" -C "${release_dir}"
          tar -xzf "${assets_archive}" --strip-components=1 -C ./public/indexador/runtime
          test -x "${release_dir}/indexador"
          test -f ./public/indexador/runtime/indexador_wasm.wasm
          test -f ./public/indexador/runtime/indexador-pagefind.js
          echo "INDEXADOR_BINARY=${release_dir}/indexador" >> "${GITHUB_ENV}"

      - name: Build custom indices
        run: |
          set -euo pipefail
          test -x "${INDEXADOR_BINARY}"
          node ../tools/build_indices_indexador_from_json.mjs \
            --source-manifest ./public/indices/manifest.json \
            --out "./public/indexador/indices/${PUBLIC_INDEXADOR_INDICES_VERSION}" \
            --binary "${INDEXADOR_BINARY}" \
            --base /BibliothecaPatristica \
            --documents-per-shard 500 \
            --smoke-query 'clemens::volume=PG001' \
            --smoke-query 'clementis::volume=PG001' \
            --smoke-query 'corinthios::volume=PG001' \
            --smoke-query 'Primeira Epístola aos Coríntios::volume=PG001' \
            --smoke-query 'First Epistle to the Corinthians::volume=PG001' \
            --smoke-query 'Prima Lettera ai Corinzi::volume=PG001' \
            --smoke-query 'Première épître aux Corinthiens::volume=PG001' \
            --all
          node ../tools/build_search_indexador_from_shards.mjs \
            --public ./public \
            --source-manifest ./public/volumes.json \
            --out "./public/indexador/search/${PUBLIC_INDEXADOR_SEARCH_VERSION}" \
            --binary "${INDEXADOR_BINARY}" \
            --base /BibliothecaPatristica \
            --layout unified \
            --documents-per-shard 500 \
            --all

      - name: Validate custom index assets
        run: |
          set -euo pipefail
          indices_dir="./public/indexador/indices/${PUBLIC_INDEXADOR_INDICES_VERSION}"
          test -s "${indices_dir}/index.map"
          test -s "${indices_dir}/manifest.json"
          search_dir="./public/indexador/search/${PUBLIC_INDEXADOR_SEARCH_VERSION}"
          test -s "${search_dir}/manifest.json"
          test -s "${search_dir}/all/words_0.gz"
          find "${indices_dir}" -name '*.gz' -type f -print0 | xargs -0 -n1 gzip -t
          find "${search_dir}" -name '*.gz' -type f -print0 | xargs -0 -n1 gzip -t
          node -e "const fs=require('fs'); const source=JSON.parse(fs.readFileSync('./public/indices/manifest.json')); const built=JSON.parse(fs.readFileSync(process.argv[1])); const expected=(source.volumes||[]).reduce((n,v)=>n+1+Number(v.works_total||0)+Number(v.sections_total||0)+Number(v.entries_total||0),0); if(built.engine!=='PatrologiaIndexer'||built.sample||built.content_schema_version!==3||built.total_documents!==expected||built.source_generated_at!==source.generated_at) process.exit(1); console.log('Indices index:', built.total_documents, 'documents from', built.volumes, 'volumes');" "${indices_dir}/manifest.json"
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1])); if(m.engine!=='PatrologiaIndexer'||m.sample||m.total_documents<1||m.suggestions?.wordlists!==true) process.exit(1); console.log('Search index:', m.total_documents, 'documents with suggestion wordlists');" "${search_dir}/manifest.json"

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
