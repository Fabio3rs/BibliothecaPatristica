name: Publish GitHub Pages

on:
  push:
    branches: ["codex"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build_site:
    runs-on: ubuntu-latest
    env:
      INDEXADOR_VERSION: v0.5
      INDEXADOR_NATIVE_SHA256: d1d7f89caa992ff977f09fafdc7e5cf26bf074c931d91ced1f7bde244bd6c0e5
      INDEXADOR_ASSETS_SHA256: 9b2f9cc5ec25be54230bd94c4d6801b3696d1b9b486368f860abaefe2fbc87f5
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download PatrologiaIndexer release
        run: |
          set -euo pipefail

          release_base="https://github.com/Fabio3rs/PatrologiaIndexer/releases/download/${INDEXADOR_VERSION}"
          release_dir="${RUNNER_TEMP}/patrologia-indexer-${INDEXADOR_VERSION}"
          native_archive="${release_dir}/indexador-linux-x86_64-static-${INDEXADOR_VERSION}.tar.gz"
          assets_archive="${release_dir}/indexador-assets-${INDEXADOR_VERSION}.tar.gz"

          mkdir -p "${release_dir}" ./public/indexador/runtime
          curl --fail --location --retry 3 --output "${native_archive}" \
            "${release_base}/indexador-linux-x86_64-static-${INDEXADOR_VERSION}.tar.gz"
          curl --fail --location --retry 3 --output "${assets_archive}" \
            "${release_base}/indexador-assets-${INDEXADOR_VERSION}.tar.gz"

          printf '%s  %s\n' "${INDEXADOR_NATIVE_SHA256}" "${native_archive}" | sha256sum --check --status
          printf '%s  %s\n' "${INDEXADOR_ASSETS_SHA256}" "${assets_archive}" | sha256sum --check --status

          tar -xzf "${native_archive}" -C "${release_dir}"
          tar -xzf "${assets_archive}" --strip-components=1 -C ./public/indexador/runtime
          test -x "${release_dir}/indexador"
          test -f ./public/indexador/runtime/indexador_wasm.wasm
          test -f ./public/indexador/runtime/indexador-pagefind.js
          echo "INDEXADOR_BINARY=${release_dir}/indexador" >> "${GITHUB_ENV}"

      - name: Build custom indices
        run: |
          set -euo pipefail
          test -x "${INDEXADOR_BINARY}"
          node ../tools/build_indices_indexador_from_json.mjs \
            --source-manifest ./public/indices/manifest.json \
            --out ./public/indexador/indices \
            --binary "${INDEXADOR_BINARY}" \
            --base /BibliothecaPatristica \
            --documents-per-shard 500 \
            --all
          node ../tools/build_search_indexador_from_shards.mjs \
            --public ./public \
            --source-manifest ./public/volumes.json \
            --out ./public/indexador/search \
            --binary "${INDEXADOR_BINARY}" \
            --base /BibliothecaPatristica \
            --layout unified \
            --documents-per-shard 500 \
            --all

      - name: Validate custom index assets
        run: |
          set -euo pipefail
          test -s ./public/indexador/indices/index.map
          test -s ./public/indexador/search/manifest.json
          find ./public/indexador/indices -name '*.gz' -type f -print0 | xargs -0 -n1 gzip -t
          find ./public/indexador/search -name '*.gz' -type f -print0 | xargs -0 -n1 gzip -t
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('./public/indexador/search/manifest.json')); if(m.engine!=='PatrologiaIndexer'||m.sample||m.total_documents<1) process.exit(1); console.log('Search index:', m.total_documents, 'documents');"

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
